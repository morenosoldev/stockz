# ==============================================================================
# Recover-Bot Configuration
# ==============================================================================
# This YAML file provides default configuration values.
# Environment variables override these values.
#
# See .env.example for available environment variables.

# ------------------------------------------------------------------------------
# Application Settings
# ------------------------------------------------------------------------------
app:
  name: "Recover-Bot"
  version: "1.0.0"
  debug: false
  env: "development"
  log_level: "INFO"
  log_format: "json" # json or text
  structured_logging: true

# ------------------------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------------------------
database:
  url: "postgresql://recoverbot:recoverbot@localhost:5433/recoverbot"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  echo: false # Set to true to log all SQL queries

# ------------------------------------------------------------------------------
# Scheduler Configuration
# ------------------------------------------------------------------------------
scheduler:
  cron_schedule: "30 16 * * *" # Daily at 16:30 UTC (after US market close)
  timezone: "UTC"
  enabled: true
  max_instances: 1
  coalesce: true # Combine missed runs
  misfire_grace_time: 300 # 5 minutes

# ------------------------------------------------------------------------------
# Scanner Configuration
# ------------------------------------------------------------------------------
scanner:
  universe_size: 2000 # Number of tickers to scan
  concurrency: 50 # Concurrent ticker processing
  timeout: 600 # Scanner timeout in seconds (10 minutes)
  cache_ttl_seconds: 3600 # Cache TTL (1 hour)
  retry_attempts: 3
  retry_backoff: 2.0 # Exponential backoff multiplier

# ------------------------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------------------------
datasources:
  price_provider: "twelve_data" # twelve_data, yahoo_finance, or alpha_vantage

  # Twelve Data configuration (Primary data provider)
  twelve_data:
    api_key: null # Set via TWELVE_DATA_API_KEY environment variable
    plan: "basic" # basic (8/min, 8k/day) or grow (8/sec, 55k/day)
    rate_limit:
      calls_per_minute: 8 # Basic plan: 8 API credits/minute
      daily_limit: 8000 # Basic plan: 8,000 API credits/day
      delay_between_calls: 7.5 # Seconds between calls (8/min = 7.5s)
    cache_ttl_seconds: 3600 # 1 hour cache (reduce API usage)
    timeout_seconds: 30
    retry_attempts: 3
    retry_backoff: 2.0 # Exponential backoff multiplier

  yahoo_finance_api_key: null # Optional (uses public API if null)
  alpha_vantage_api_key: null # Required if using alpha_vantage
  news_api_key: null # Required for news sentiment features
  api_timeout: 30
  api_retry_attempts: 3

  # Cache configuration for data adapters
  cache:
    cache_dir: "data/cache" # Directory for cached data
    ttl_seconds: 3600 # Default TTL (1 hour)
    use_compression: false # Compression support (future feature)
    auto_cleanup: true # Automatically clean expired entries

  # Reddit adapter configuration
  reddit:
    # Ticker validation blacklist (extensible via config)
    ticker_blacklist:
      # Enable config-based blacklist (merges with built-in blacklist)
      enabled: true
      # Additional custom words to blacklist (supplements built-in list)
      custom_words:
        - "MOON"
        - "GAINS"
        - "LOSS"
        # Add more as needed

    # AI-powered company detection settings
    company_detection:
      # Enable AI pipeline (NER → LLM → yfinance)
      enabled: true
      # Use spaCy NER for company name detection
      use_ner: true
      # Use LLM for ticker resolution
      use_llm: true
      # Validate all tickers via yfinance
      validate_existence: true
      # Log detailed AI pipeline steps (NER entities, LLM calls, cache hits)
      verbose_logging: false

    # Ticker validation settings
    ticker_validation:
      # Validate ticker formats before processing
      enabled: true
      # Support international tickers (e.g., GUBRA.CO, SAP.DE)
      allow_exchange_suffixes: true
      # Support share classes (e.g., BRK-B, GOOG-A)
      allow_share_classes: true
      # Reject pure numeric tickers (e.g., "2024", "123")
      reject_numbers_only: true

# ------------------------------------------------------------------------------
# Strategy Configuration
# ------------------------------------------------------------------------------
strategies:
  enabled_strategies:
    - "drop5"
  min_score_threshold: 0.5 # Minimum score to be considered a candidate

# ------------------------------------------------------------------------------
# Feature Engineering
# ------------------------------------------------------------------------------
features:
  version: "1.0.0"
  atr_window: 14 # Average True Range window
  rsi_window: 14 # Relative Strength Index window
  sma_window: 50 # Simple Moving Average window
  volume_window: 20 # Volume analysis window

# ------------------------------------------------------------------------------
# Evaluation & Backtesting
# ------------------------------------------------------------------------------
evaluation:
  recovery_window_days: 5 # Days to check for recovery (T+1 to T+5)
  recovery_threshold_pct: 3.0 # Recovery threshold percentage

# ------------------------------------------------------------------------------
# API Configuration
# ------------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  docs_enabled: true # Enable Swagger UI
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"

# ------------------------------------------------------------------------------
# LLM Configuration (for research pipeline)
# ------------------------------------------------------------------------------
llm:
  openai_api_key: "" # Set via LLM_OPENAI_API_KEY environment variable
  model_claim_extractor: "gpt-4o-mini" # Cost-effective model for claim extraction
  model_fact_checker: "gpt-4o" # Better reasoning model for fact-checking and research
  max_retries: 3
  timeout_seconds: 30
