services:
  postgres:
    image: postgres:15-alpine
    container_name: recoverbot-postgres
    environment:
      POSTGRES_USER: recoverbot
      POSTGRES_PASSWORD: recoverbot
      POSTGRES_DB: recoverbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recoverbot-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: recoverbot-api
    environment:
      - DATABASE_URL=postgresql://recoverbot:recoverbot@postgres:5432/recoverbot
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_DEBUG=${APP_DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - recoverbot-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  recoverbot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
