[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recover-bot"
version = "1.0.0"
description = "A backend service for identifying stock market recovery opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Recover-Bot Team"}
]
keywords = ["stocks", "trading", "market-analysis", "recovery", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "apscheduler>=3.10.4",
    "httpx>=0.25.1",
    "pandas>=2.1.3",
    "numpy>=1.26.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.6",
    "yfinance>=0.2.32",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "black>=23.11.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.1",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.8.19",
]

[project.urls]
Homepage = "https://github.com/morenosoldev/stockz"
Repository = "https://github.com/morenosoldev/stockz"
Documentation = "https://github.com/morenosoldev/stockz/blob/main/README.md"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = false
plugins = ["pydantic.mypy"]
exclude = [
    "migrations/",
    ".venv/",
    "build/",
    "dist/",
]

# SQLAlchemy stubs configuration
[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

# SQLAlchemy 2.0 DeclarativeBase type issues
[[tool.mypy.overrides]]
module = "src.storage.database"
disable_error_code = ["attr-defined", "misc"]

[[tool.mypy.overrides]]
module = "src.storage.models"
warn_return_any = false

# FastAPI route decorators are not fully typed
[[tool.mypy.overrides]]
module = "src.api.routes.*"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "src.api.main"
disable_error_code = ["misc"]

# Relax strict typing for data processing modules with pandas
[[tool.mypy.overrides]]
module = "src.features.*"
warn_return_any = false
disallow_untyped_defs = false
disable_error_code = ["call-overload", "operator"]

[[tool.mypy.overrides]]
module = "src.datasources.prices"
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests that may use real external services",
    "slow: Tests that take longer to run (benchmarks, etc.)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
